<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ezMM{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%236d5efc'/><rect x='8' y='8' width='7' height='7' rx='2' fill='white'/><rect x='17' y='8' width='7' height='7' rx='2' fill='white' opacity='.6'/><rect x='8' y='17' width='7' height='7' rx='2' fill='white' opacity='.6'/><rect x='17' y='17' width='7' height='7' rx='2' fill='white'/></svg>">
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
    <script>
        try {
            const t = localStorage.getItem("ezmm-theme");
            if (t) document.documentElement.dataset.theme = t;
        } catch (e) {}
    </script>
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/">
            <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span>ezMM</span>
        </a>
        <nav class="nav">
            <a href="/" class="{{ 'active' if nav == 'items' }}">Items</a>
            <a href="/search" class="{{ 'active' if nav == 'search' }}">Search</a>
            <a href="/sequences" class="{{ 'active' if nav == 'sequences' }}">Sequences</a>
        </nav>
        <form class="search" action="/" method="get" role="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            {% if kind and nav == 'items' %}<input type="hidden" name="kind" value="{{ kind }}">{% endif %}
            {% if missing %}<input type="hidden" name="missing" value="1">{% endif %}
            <input id="search" type="search" name="q" value="{{ q if q and nav == 'items' else '' }}" placeholder="Search URLs, paths, hashes…" autocomplete="off">
            <kbd>/</kbd>
        </form>
        <button class="icon-btn" id="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme">
            <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
    </div>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js" defer></script>
</body>
</html>
