[project]
name = "ezMM"
version = "0.7.3"
description = "Lightweight Python kit for easy multimodal data processing."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Mark Rothermel", email = "mark.rothermel@tu-darmstadt.de"}]
dependencies = [
    "pillow~=12.3.0",
    "pillow-avif-plugin==1.6.0",
    "opencv-python~=5.0.0.93",
    "markdown~=3.10.2",
    "imageio-ffmpeg",
    "m3u8",
    "jinja2",
    "mutagen",
    "numpy",
]

[project.optional-dependencies]
# Embeddings with EmbeddingGemma 2 (for GPU support, see the README)
embed = [
    "torch",
    "torchvision",
    "transformers>=5.19.0",
    "sentence-transformers>=6.1.0",
    "pypdfium2",
]
ui = [
    "uvicorn~=0.51.0",
    "fastapi~=0.139.2",
    "starlette~=1.3.1",
    "python-multipart",
]
test = [
    "ezMM[embed,ui]",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[project.scripts]
ezmm = "ezmm.__main__:main"

[project.urls]
"Homepage" = "https://github.com/multimodal-ai-lab/ezmm"
"Issues" = "https://github.com/multimodal-ai-lab/ezmm/issues"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001",  # Broad exception catches are deliberate at error boundaries (UI, per-file errors in bulk embedding)
    "C408",    # dict(...) calls are the preferred style for dicts with keyword keys
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Re-exports of the public API

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.package-data]
ezmm = ["ui/templates/*", "ui/static/*"]
